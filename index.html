<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Living Tree: Four Seasons</title>
<link rel="stylesheet" href="style.css">


</head>
<body>
<div id="stage">
	<canvas id="scene"></canvas>
	<div id="title">
		<h1>The Living Tree</h1>
		<p>Four Seasons</p>
	</div>
	<div id="hint">Tap the sun for day and night · the storm cloud for rain and snow · the tree for a gust of wind · choose a season and watch it grow into the next</div>
	<div id="seasons" role="group" aria-label="Seasons">
		<button data-season="0" class="chip">Spring</button>
		<button data-season="1" class="chip">Summer</button>
		<button data-season="2" class="chip">Autumn</button>
		<button data-season="3" class="chip">Winter</button>
	</div>
</div>

<script src="script.js" defer></script>
</body>
</html>
